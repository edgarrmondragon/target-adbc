default_environment: dev
project_id: 019a7ffa-a4fc-7295-aa24-19cc783663d1
environments:
- name: dev
- name: staging
- name: prod
send_anonymous_usage_stats: false
plugins:
  extractors:
  - name: tap-fedidb
    variant: edgarrmondragon
    pip_url: tap-fedidb
    select:
    - '*.*'
    - '!servers.*'
  loaders:
  - name: target-adbc
    namespace: target_adbc
    pip_url: -e .
    executable: target-adbc
    settings:
    - name: driver
      kind: options
      description: ADBC driver name (e.g., duckdb, sqlite, postgresql)
      options:
      - label: DuckDB
        value: duckdb
      - label: SQLite
        value: sqlite
      - label: PostgreSQL
        value: postgresql

    # DuckDB settings
    - name: duckdb.path
      kind: string
      description: Path to the DuckDB database file
      placeholder: file:///path/to/database.duckdb

    # SQLite settings
    - name: sqlite.uri
      kind: string
      description: URI to the SQLite database file
      placeholder: file:///path/to/database.sqlite

    # PostgreSQL settings
    - name: postgresql.uri
      kind: string
      description: URI to the PostgreSQL database
      placeholder: Ex. postgresql://postgres:password@localhost:5432/database
      sensitive: true

    # Default target schema
    - name: default_target_schema
      kind: string
      description: Default schema to use for tables if not specified in stream name

    # Table prefix
    - name: table_prefix
      kind: string
      description: Prefix to add to all table names

    # Table suffix
    - name: table_suffix
      kind: string
      description: Suffix to add to all table names

    # Batch size
    - name: batch_size_rows
      kind: integer
      description: Maximum number of rows to process in a single batch

    # Overwrite behavior
    - name: overwrite_behavior
      kind: options
      description: Behavior when table already exists
      options:
      - label: Append
        value: append
      - label: Replace
        value: replace
      - label: Fail
        value: fail

    # Add record metadata
    - name: add_record_metadata
      kind: boolean
      description: Add metadata columns to the output tables

    # VARCHAR length
    - name: varchar_length
      kind: integer
      description: Default length for VARCHAR columns when not specified

  - name: target-adbc-duckdb
    inherit_from: target-adbc
    config:
      driver: duckdb
      overwrite_behavior: replace
      duckdb:
        path: ${MELTANO_PROJECT_ROOT}/output/warehouse.duckdb

  - name: target-adbc-sqlite
    inherit_from: target-adbc
    config:
      driver: sqlite
      overwrite_behavior: replace
      sqlite:
        uri: ${MELTANO_PROJECT_ROOT}/output/warehouse.sqlite
