[project]
name = "target-adbc"
version = "0.1.0"
description = "Singer target for loading data into ADBC-compatible databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "singer-sdk~=0.53.5",
    "adbc-driver-manager>=1.9.0",
    "pyarrow>=22.0.0",
    "duckdb>=1.4.1",
]
optional-dependencies.duckdb = ["duckdb>=1.4.1"]

[project.scripts]
target-adbc = "target_adbc.target:TargetADBC.cli"

[dependency-groups]
dev = [
    "coverage>=7.11.3",
    "mypy>=1.18.0",
    "pyarrow-stubs>=20.0.0.20251107",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "target-adbc[duckdb]",
    "ty>=0.0.1a25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "S",
    "TC",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",  # pytest uses assert statements
    "S608",  # Raw SQL queries are OK in tests
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
