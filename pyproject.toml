[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "target-adbc"
description = "Singer target for loading data into ADBC-compatible databases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "adbc-driver-manager~=1.11",
  "pyarrow~=25.0",
  "singer-sdk~=0.55.0a1",
]
optional-dependencies.duckdb = [
  "duckdb>=1.5.5",
]
optional-dependencies.postgres = [
  "adbc-driver-postgresql~=1.11",
]
optional-dependencies.sqlite = [
  "adbc-driver-sqlite~=1.11",
]
[project.scripts]
target-adbc = "target_adbc.target:TargetADBC.cli"

[dependency-groups]
dev = [
  "coverage>=7.15",
  "mypy>=2.3",
  "pyarrow-stubs>=20.0.0.20251107",
  "pytest>=9.1",
  "ruff>=0.16",
  "testcontainers[mssql,postgres]>=4.15",
  "ty>=0.0.62",
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.uv.sources]
singer-sdk = { git = "https://github.com/meltano/sdk.git", rev = "main" }
# adbc-driver-manager = { "index" = "arrow-adbc-nightlies" }
# adbc-driver-postgresql = { "index" = "arrow-adbc-nightlies" }
# adbc-driver-sqlite = { "index" = "arrow-adbc-nightlies" }

# [[tool.uv.index]]
# name = "arrow-adbc-nightlies"
# url = "https://repo.fury.io/arrow-adbc-nightlies"

[tool.ruff]
line-length = 100
preview = true
required-version = ">=0.16"
[tool.ruff.lint]
extend-select = [
  "ERA",  # https://docs.astral.sh/ruff/rules/#eradicate-era
  "ANN",  # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
  "S",    # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "B",    # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "RSE",  # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
  "RET",  # https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "SLF",  # https://docs.astral.sh/ruff/rules/#flake8-self-slf
  "SIM",  # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TC",   # https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
  "FLY",  # https://docs.astral.sh/ruff/rules/#flynt-fly
  "I",    # https://docs.astral.sh/ruff/rules/#isort-i
  "C90",  # https://docs.astral.sh/ruff/rules/#mccabe-c90
  "PERF", # https://docs.astral.sh/ruff/rules/#perflint-perf
  "PL",   # https://docs.astral.sh/ruff/rules/#pylint-pl
  "UP",   # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "FURB", # https://docs.astral.sh/ruff/rules/#refurb-furb
  "RUF",  # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
]
[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "any-type",
  "magic-value-comparison",
  "assert",
  "hardcoded-sql-expression",
]

[tool.mypy]
follow_untyped_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true

[tool.ty.rules]
missing-override-decorator = "error"

[tool.pytest]
addopts = [ "-v", "-ra" ]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.tox]
requires = [
  "tox>=4.58",
  "tox-uv>=1.36",
]
env_list = [
  "lint",
  { prefix = "3.", start = 10, stop = 15 },
  "pypi",
]

[tool.tox.env.lint]
description = "lint"
dependency_groups = [
  "dev",
]
commands = [
  [
    "ruff",
    "check",
    { replace = "if", condition = "env.GITHUB_ACTIONS == 'true'", then = [ "--output-format=github" ], else = [], extend = true },
  ],
  [
    "ruff",
    "format",
    "--check",
    { replace = "if", condition = "env.GITHUB_ACTIONS == 'true'", then = [ "--output-format=github" ], else = [], extend = true },
  ],
  ["mypy", "target_adbc", "tests"],
  [
    "ty",
    "check",
    "target_adbc",
    "tests",
    { replace = "if", condition = "env.GITHUB_ACTIONS == 'true'", then = [ "--output-format=github" ], else = [], extend = true },
  ],
]

[tool.tox.env.dbc]
description = "run tests on Python {py_dot_ver} with dbc-managed drivers"
extras = []

[tool.tox.env_run_base]
description = "run tests on Python {py_dot_ver}"
pass_env = [
  "CI",
]
dependency_groups = [
  "dev",
]
extras = [
  "duckdb",
  "postgres",
  "sqlite",
]
commands = [
  [
    "pytest",
    { replace = "posargs", default = [ "tests" ], extend = true },
  ],
]
